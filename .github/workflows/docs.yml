---
name: Generate Role Docs
'on':
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - galaxy.yml
      - roles/ce_install/.aar_doc.yml
      - roles/ce_install/README.md
      - roles/ce_install/meta/argument_specs.yml
      - roles/ce_install/meta/main.yml
defaults:
  run:
    working-directory: 'trippsc2.nexus'
jobs:
  docs_ce_install:
    name: Generate ce_install role documentation
    permissions:
      contents: write
    runs-on:
      - self-hosted
      - linux
      - ansible
      - x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: trippsc2.nexus
          ref: main
      - name: Generate ce_install role documentation
        working-directory: 'trippsc2.nexus'
        run: |
          source ~/venv/ansible-2.16/bin/activate
          cd ./roles/ce_install
          aar-doc . markdown
          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"
          git add README.md || /bin/true
          git commit -m "Update ce_install role documentation." || /bin/true
          git push origin main
          deactivate
